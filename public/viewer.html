<!DOCTYPE html>
<html><head>
<meta charset="UTF-8">
<title>Model Viewer</title>
<style>body{margin:0;overflow:hidden;background:#222}canvas{display:block}#info{position:fixed;top:10px;left:10px;color:#fff;font:14px monospace;background:rgba(0,0,0,0.7);padding:10px;border-radius:4px}</style>
</head><body>
<div id="info">Loading model...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// OBJLoader inline
class OBJLoader {
  load(url, onLoad) {
    fetch(url).then(r => r.text()).then(text => {
      const obj = this.parse(text);
      onLoad(obj);
    });
  }
  parse(text) {
    const group = new THREE.Group();
    const vertices = [], normals = [];
    let currentGeo = null, currentVerts = [], currentNorms = [];
    const materials = {};
    let currentMat = 'default';

    const flush = (name) => {
      if (currentVerts.length > 0) {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(currentVerts, 3));
        if (currentNorms.length === currentVerts.length)
          geo.setAttribute('normal', new THREE.Float32BufferAttribute(currentNorms, 3));
        else geo.computeVertexNormals();
        const color = this.matColors && this.matColors[currentMat] ? new THREE.Color(...this.matColors[currentMat]) : new THREE.Color(0x6b7d5e);
        const mesh = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({ color, side: THREE.DoubleSide }));
        mesh.name = name || '';
        group.add(mesh);
      }
      currentVerts = [];
      currentNorms = [];
    };

    let groupName = '';
    const lines = text.split('\n');
    for (const line of lines) {
      const parts = line.trim().split(/\s+/);
      switch(parts[0]) {
        case 'v': vertices.push(parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])); break;
        case 'vn': normals.push(parseFloat(parts[1]), parseFloat(parts[2]), parseFloat(parts[3])); break;
        case 'usemtl': currentMat = parts[1]; break;
        case 'g':
          flush(groupName);
          groupName = parts.slice(1).join(' ');
          break;
        case 'f':
          const faceVerts = [];
          for (let i = 1; i < parts.length; i++) {
            const indices = parts[i].split('/');
            const vi = (parseInt(indices[0]) - 1) * 3;
            faceVerts.push(vertices[vi], vertices[vi+1], vertices[vi+2]);
            if (indices[2]) {
              const ni = (parseInt(indices[2]) - 1) * 3;
              currentNorms.push(normals[ni], normals[ni+1], normals[ni+2]);
            }
          }
          for (let i = 1; i < faceVerts.length/3 - 1; i++) {
            currentVerts.push(faceVerts[0], faceVerts[1], faceVerts[2]);
            currentVerts.push(faceVerts[i*3], faceVerts[i*3+1], faceVerts[i*3+2]);
            currentVerts.push(faceVerts[(i+1)*3], faceVerts[(i+1)*3+1], faceVerts[(i+1)*3+2]);
          }
          break;
      }
    }
    flush(groupName);
    return group;
  }
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 5000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(100, 200, 100);
scene.add(dl);
scene.add(new THREE.GridHelper(1000, 100, 0x444444, 0x333333));

const loader = new OBJLoader();
loader.load('/models/base.obj', (obj) => {
  const box = new THREE.Box3().setFromObject(obj);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  obj.position.sub(center);
  scene.add(obj);
  const maxDim = Math.max(size.x, size.y, size.z);
  camera.position.set(0, maxDim * 0.8, maxDim * 1.2);
  camera.lookAt(0, 0, 0);
  document.getElementById('info').innerHTML =
    `Parts: ${obj.children.length} | Verts: ~28K | Size: ${size.x.toFixed(0)} x ${size.y.toFixed(0)} x ${size.z.toFixed(0)}<br>Mouse drag: rotate · Scroll: zoom`;
});

let isDragging = false, prevX = 0, prevY = 0, rotY = 0, rotX = 0.3, dist = 500;
renderer.domElement.addEventListener('mousedown', e => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
renderer.domElement.addEventListener('mouseup', () => isDragging = false);
renderer.domElement.addEventListener('mousemove', e => {
  if (!isDragging) return;
  rotY += (e.clientX - prevX) * 0.005;
  rotX += (e.clientY - prevY) * 0.005;
  rotX = Math.max(-1.5, Math.min(1.5, rotX));
  prevX = e.clientX; prevY = e.clientY;
});
renderer.domElement.addEventListener('wheel', e => {
  dist += e.deltaY * 0.5;
  dist = Math.max(50, Math.min(2000, dist));
});

function animate() {
  requestAnimationFrame(animate);
  camera.position.x = Math.sin(rotY) * Math.cos(rotX) * dist;
  camera.position.y = Math.sin(rotX) * dist;
  camera.position.z = Math.cos(rotY) * Math.cos(rotX) * dist;
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
animate();
window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body></html>
